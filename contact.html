<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Amany Portfolio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark border-bottom border-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-info-custom" href="index.html">
                <i class="fas fa-chart-line me-2"></i> <span class="text-white">Analytics</span>
            </a>Amany
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-3">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="skills.html">Skills</a></li>
                    <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
                    <li class="nav-item"><a class="nav-link active fw-bold" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contact Section -->
    <section class="py-5 min-vh-100">
        <div class="container py-4">
            <h2 class="display-5 fw-bold text-center mb-2">Get In <span class="text-info-custom">Touch</span></h2>
            <p class="text-center text-info-custom mb-5">Feel free to reach out for collaborations or project inquiries</p>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card-dark p-4 p-md-5">
                        <form>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label text-info-custom">Your Name</label>
                                    <input type="text" class="form-control bg-black text-info-custom border-info" placeholder="John Doe">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-info-custom">Your Email</label>
                                    <input type="email" class="form-control bg-black text-info-custom border-info" placeholder="name@example.com">
                                </div>
                                <div class="col-12">
                                    <label class="form-label text-info-custom">Subject</label>
                                    <input type="text" class="form-control bg-black text-info-custom border-info" placeholder="Project Discussion">
                                </div>
                                <div class="col-12">
                                    <label class="form-label text-info-custom">Message</label>
                                    <textarea class="form-control bg-black text-info-custom border-info" rows="5" placeholder="Write your message here..."></textarea>
                                </div>
                                <div class="col-12 text-center mt-4">
                                    <button type="submit" class="btn btn-info btn-lg px-5 fw-bold">Send Message</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
